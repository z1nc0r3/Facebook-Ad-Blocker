<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>FB Ad Filter • Options</title>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="popup-wrapper">
			<div class="header">
				<div class="header-left">
					<span class="header-icon">🛡️</span>
					<div class="header-titles">
						<h1>FB Ad Filter</h1>
						<span id="appVersion" class="version-badge"></span>
					</div>
				</div>
				<a href="https://github.com/z1nc0r3/Facebook-Ad-Blocker" target="_blank" class="github-icon-link" title="GitHub Repository">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>
				</a>
			</div>

			<div class="content">
				<div id="updateBanner" class="update-banner" style="display: none;">
					<div class="update-info">
						<span class="update-title">🚀 New update available!</span>
						<span id="updateVersion" class="update-ver"></span>
					</div>
					<a id="updateLink" class="update-btn" href="#" target="_blank">Get Update</a>
				</div>

				<div class="settings-card">
					<div class="row">
						<div class="row-info">
							<label for="enabled">Extension Status</label>
							<div class="desc">Enable or disable FB Ad Filter on Facebook.</div>
						</div>
						<label class="switch">
							<input id="enabled" type="checkbox" />
							<span class="slider"></span>
						</label>
					</div>

					<div class="row">
						<div class="row-info">
							<label for="debugMode">Debug Mode</label>
							<div class="desc">Highlight and label sponsored posts instead of hiding them.</div>
						</div>
						<label class="switch">
							<input id="debugMode" type="checkbox" />
							<span class="slider"></span>
						</label>
					</div>

					<div class="row">
						<div class="row-info">
							<label for="showBanner">Hidden Post Indicator</label>
							<div class="desc">Show a subtle inline banner where an ad was removed.</div>
						</div>
						<label class="switch">
							<input id="showBanner" type="checkbox" />
							<span class="slider"></span>
						</label>
					</div>
				</div>

				<div class="save">
					<button id="saveBtn">Save Settings</button>
					<span id="savedOk" class="ok">Saved ✓</span>
				</div>
			</div>

			<div class="footer">
				<a href="https://github.com/z1nc0r3/Facebook-Ad-Blocker/releases" target="_blank" class="footer-link">GitHub Releases</a>
				<span class="dot">•</span>
				<a href="https://github.com/z1nc0r3/Facebook-Ad-Blocker/issues" target="_blank" class="footer-link">Report Issue</a>
			</div>
		</div>

		<script src="popup.js"></script>
	</body>
</html>
